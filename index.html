<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3aa7c4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>えのしま合宿 2026｜身内用しおり＆マップ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --sea:#3aa7c4; --sea-d:#1f7a94; --sun:#ff9a5a; --pink:#ff8fa3;
  --bg:#fff8ec; --card:#fff; --ink:#463a32; --sub:#8f7f73;
  --line:#f1e3d0; --ok:#4fb477; --warn:#e8a33d; --bad:#e2685a; --poi:#5aa9e6;
  --sh:0 6px 18px rgba(130,100,70,.12);
  --navh:calc(60px + env(safe-area-inset-bottom));
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'M PLUS Rounded 1c',system-ui,-apple-system,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  color:var(--ink);line-height:1.6;
  background:radial-gradient(900px 380px at 50% -160px,#cdeaf3 0,rgba(205,234,243,0) 70%),var(--bg);
  padding-bottom:calc(24px + var(--navh));
}
.wrap{max-width:560px;margin:0 auto;padding:0 14px}
header{
  background:linear-gradient(160deg,#4fc0da,#3aa7c4 60%,#2b93b0);
  color:#fff;padding:18px 0 26px;position:relative;overflow:hidden;
  border-radius:0 0 26px 26px;box-shadow:var(--sh);
}
header:after{
  content:"";position:absolute;left:-10%;right:-10%;bottom:-14px;height:34px;
  background:radial-gradient(circle at 12px -6px,var(--bg) 14px,transparent 15px) 0 0/28px 34px repeat-x;
}
h1{margin:0;font-size:22px;font-weight:800}
.sub{font-size:12.5px;opacity:.92;margin-top:2px}
.count{margin-top:12px;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.4);
  border-radius:999px;padding:7px 14px;display:inline-block;font-weight:700;font-size:14px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin:12px 0}
.sect{margin:18px 0 8px;font-size:15px;font-weight:800}
.muted{color:var(--sub);font-size:12.5px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#f4ede3;color:var(--sub)}
.tag.tbd{background:#fff2dc;color:#b5741a}
.tag.now{background:#ffe6ec;color:#d43f5e}
.tag.ap{background:#eee9fa;color:#6b57b5}
.tag.ok{background:#e2f3e9;color:#2f7d52}
.tag.bad{background:#fde8e5;color:#b23f31}
.tag.warn{background:#fdf0d9;color:#96660f}
.tag.hard{background:#ffe0e6;color:#c23b57}
.btn{appearance:none;border:none;border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:13.5px;background:var(--sea);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.08);cursor:pointer}
.btn:active{transform:translateY(1px)}
.btn.g{background:#f2eae0;color:var(--ink)}
.btn.o{background:var(--sun)}
.btn.r{background:var(--bad)}
.btn.sm{padding:6px 12px;font-size:12.5px}
.btn.w{width:100%}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
input,select,textarea{font:inherit;color:var(--ink);background:#fdf9f3;border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;width:100%}
.x{border:none;background:none;color:#c9b5a4;font-size:17px;cursor:pointer;padding:2px 6px;line-height:1}
.dayhead{display:flex;align-items:center;gap:10px;margin:20px 0 6px}
.dayno{width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;color:#fff;font-weight:800;font-size:11px;text-align:center;line-height:1.1;box-shadow:var(--sh)}
.daytitle{font-weight:800;font-size:16px}
.tl{position:relative;padding-left:22px}
.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:10px;width:3px;border-radius:3px;background:var(--line)}
.ev{position:relative;margin:0 0 10px}
.ev:before{content:"";position:absolute;left:-20px;top:18px;width:11px;height:11px;border-radius:50%;background:#fff;border:3px solid var(--line)}
.ev.done:before{background:var(--ok);border-color:#d6efe0}
.ev.cur:before{background:var(--pink);border-color:#ffdbe3;box-shadow:0 0 0 5px rgba(255,143,163,.18)}
.evbox{background:var(--card);border-radius:16px;box-shadow:var(--sh);padding:11px 12px;display:flex;gap:10px}
.ev.done .evbox{opacity:.58}
.ev.hard .evbox{border:2px solid #ffd3dc}
.chk{width:24px;height:24px;flex:none;border-radius:8px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-size:14px;color:#fff;cursor:pointer;margin-top:2px}
.ev.done .chk{background:var(--ok);border-color:var(--ok)}
.time{font-weight:800;font-size:13px;color:var(--sea-d)}
.ttl{font-weight:700;font-size:15px;margin:1px 0 2px}
.plc{font-size:12.5px;color:var(--sub)}
.note{font-size:12.5px;color:var(--sub);margin-top:4px;background:#fdf6ec;border-radius:10px;padding:6px 8px}
.info{font-size:12px;color:var(--sea-d);font-weight:700;margin-top:3px}
.yen{font-size:12px;font-weight:800;color:var(--sun)}
.pinbtn{border:none;background:#e7f4f8;color:var(--sea-d);font:inherit;font-weight:800;font-size:11.5px;border-radius:999px;padding:4px 10px;cursor:pointer;margin-top:5px}
.pinbtn.c{background:#fdeee6;color:#b5642a;margin-left:5px}
.nb{display:inline-grid;place-items:center;width:19px;height:19px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;vertical-align:1px;margin-right:2px}
.total{background:linear-gradient(150deg,#ffd9a8,#ffb877);border-radius:var(--r);padding:16px;text-align:center;box-shadow:var(--sh);color:#6b3f13}
.total b{font-size:28px;font-weight:800;display:block}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:7px 4px;border-bottom:1px dashed var(--line);text-align:left;vertical-align:middle}
th{font-size:11.5px;color:var(--sub);font-weight:700}
td.n,th.n{text-align:right;white-space:nowrap}
td input{width:74px;padding:5px 7px;text-align:right;font-size:13px}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;border-radius:50%;border:none;background:#f2eae0;font-size:18px;font-weight:800;cursor:pointer}
.stepper b{font-size:20px;min-width:34px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:#f2eae0;border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:700;display:flex;align-items:center;gap:2px}
.chip.drv{background:#e3f4f9;color:var(--sea-d)}
.chip .dv{border:none;background:none;font-size:14px;cursor:pointer;padding:0 2px}
.who{display:flex;flex-wrap:wrap;gap:6px}
.who label{background:#f7f1e8;border:1.5px solid var(--line);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:700;cursor:pointer}
.who input{display:none}
.who label:has(input:checked){background:#e3f4f9;border-color:#a8dbe8;color:var(--sea-d)}
.pay{display:flex;gap:8px;align-items:center;border-bottom:1px dashed var(--line);padding:8px 0;font-size:13.5px}
.tx{background:#eef8fb;border-radius:12px;padding:9px 12px;margin:6px 0;font-size:14px;font-weight:700}
.tx span{color:var(--sea-d)}
.li{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px dashed var(--line)}
.li .chk{margin:0}
.li.on{opacity:.5}
.li.on span{text-decoration:line-through}
.li span{flex:1;font-size:14px}
.due{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 7px;background:#f4ede3;color:var(--sub);white-space:nowrap}
.due.soon{background:#fdf0d9;color:#96660f}
.due.now{background:#fde8e5;color:#b23f31}

/* 逆算アラート */
.alert{border-radius:var(--r);padding:13px 14px;box-shadow:var(--sh);margin:12px 0;background:linear-gradient(150deg,#fff1f4,#fff)}
.alert.hot{background:linear-gradient(150deg,#ffe2e6,#fff5f6);border:2px solid #ffc2cc}
.alert .lb{font-size:11.5px;font-weight:800;color:#c23b57}
.alert .bg{font-size:22px;font-weight:800;line-height:1.25}
.alert .mini{font-size:12.5px;color:var(--sub);margin-top:3px}
.bar{height:8px;border-radius:5px;background:#f1e3d0;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#7fd0a2,#ffcf7a,#ff8f9c)}

/* 天気 */
.wx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.wx::-webkit-scrollbar{display:none}
.wxd{flex:1 0 31%;min-width:104px;background:#f8fbfd;border:1.5px solid #e6f0f5;border-radius:14px;padding:9px;text-align:center}
.wxd .dt{font-size:11.5px;font-weight:800;color:var(--sea-d)}
.wxd .ic{font-size:26px;line-height:1.2}
.wxd .tp{font-size:13px;font-weight:800}
.wxd .tp em{font-style:normal;color:#e2685a}.wxd .tp i{font-style:normal;color:#5aa9e6}
.wxd .rn{font-size:11.5px;font-weight:800;color:#3b82f6}
.wxd .sn{font-size:10.5px;color:var(--sub)}

/* 投票 */
.poll{border-bottom:1px dashed var(--line);padding:11px 0}
.poll:last-child{border:none}
.pq{font-weight:800;font-size:14px;margin-bottom:7px}
.po{position:relative;background:#f8f3ec;border-radius:11px;padding:8px 11px;margin:5px 0;font-size:13.5px;font-weight:700;cursor:pointer;overflow:hidden;border:1.5px solid transparent}
.po i{position:absolute;left:0;top:0;bottom:0;background:#d9eef5;z-index:0}
.po.mine{border-color:#8dcfe2}
.po span{position:relative;z-index:1;display:flex;justify-content:space-between;gap:8px}
.po b{position:relative;z-index:1;font-size:12px;color:var(--sea-d)}
.pv{font-size:11px;color:var(--sub);position:relative;z-index:1}

/* 写真 */
.ph{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.ph figure{margin:0;position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#f2eae0}
.ph img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
.ph button{position:absolute;right:3px;top:3px;border:none;background:rgba(0,0,0,.5);color:#fff;border-radius:50%;width:22px;height:22px;font-size:12px;cursor:pointer;line-height:1}
.ph figcaption{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.42);color:#fff;font-size:9.5px;padding:2px 4px;text-align:center}

/* マップ */
#mapwrap{display:none;position:fixed;left:0;right:0;top:0;bottom:var(--navh);z-index:10}
body.mapmode #mapwrap{display:block}
body.mapmode header,body.mapmode #view,body.mapmode footer{display:none}
body.mapmode{padding-bottom:0;overflow:hidden}
#map{width:100%;height:100%;background:#dfe9ec}
.leaflet-container{font-family:inherit}
#mapbar{position:absolute;left:0;right:0;top:0;z-index:500;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
  background:linear-gradient(#fff8ecdd,#fff8ec00);pointer-events:none}
#mapbar .in{display:flex;gap:6px;align-items:center;overflow-x:auto;pointer-events:auto;scrollbar-width:none}
#mapbar .in::-webkit-scrollbar{display:none}
.dchip{border:none;font:inherit;font-weight:800;font-size:12.5px;white-space:nowrap;
  background:#fff;color:var(--sub);border-radius:999px;padding:8px 13px;box-shadow:var(--sh);cursor:pointer}
.dchip.on{color:#fff}
.mtool{position:absolute;right:10px;z-index:500;width:42px;height:42px;border-radius:50%;border:none;
  background:#fff;box-shadow:var(--sh);font-size:18px;cursor:pointer;display:grid;place-items:center;padding:0}
#btnLoc{bottom:92px}
#btnTile{bottom:138px}
#btnRoute{bottom:184px}
#btnList{bottom:230px}
#btnCam{bottom:276px}
.mtool.on{background:var(--sea);color:#fff}
#mcount{position:absolute;left:10px;bottom:92px;z-index:500;background:#fff;border-radius:14px;
  box-shadow:var(--sh);padding:7px 11px;font-size:11.5px;font-weight:800;max-width:56%;display:none}
#mcount.on{display:block}
#mcount em{font-style:normal;color:#c23b57;font-size:14px}
#pickbar{position:absolute;left:0;right:0;top:0;z-index:700;background:#ffd166;color:#5b4212;
  padding:calc(10px + env(safe-area-inset-top)) 14px 10px;font-weight:800;font-size:13px;
  display:none;align-items:center;gap:10px}
#pickbar.on{display:flex}
#pickbar button{margin-left:auto;border:none;background:rgba(0,0,0,.14);color:#5b4212;border-radius:999px;padding:5px 12px;font:inherit;font-weight:800;cursor:pointer}
.pin{width:38px;height:38px;margin-left:-19px;margin-top:-42px;border-radius:50% 50% 50% 4px;
  transform:rotate(-45deg);background:var(--c);box-shadow:0 3px 8px rgba(0,0,0,.28);
  border:2.5px solid #fff;display:grid;place-items:center}
.pin i{transform:rotate(45deg);font-style:normal;font-size:17px;line-height:1}
.pin b{position:absolute;top:-7px;right:-7px;transform:rotate(45deg);background:#fff;color:var(--c);
  font-size:10px;font-weight:800;border-radius:50%;width:17px;height:17px;display:grid;place-items:center;
  box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin u{position:absolute;left:-8px;top:-8px;transform:rotate(45deg);background:#fff;border-radius:50%;
  width:16px;height:16px;display:grid;place-items:center;font-size:9px;text-decoration:none;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.pin.dim{opacity:.45}
.pin.small{width:30px;height:30px;margin-left:-15px;margin-top:-34px}
.pin.small i{font-size:14px}
.pin.sel{animation:pop .35s ease}
@keyframes pop{0%{transform:rotate(-45deg) scale(.6)}60%{transform:rotate(-45deg) scale(1.18)}100%{transform:rotate(-45deg) scale(1)}}
.me{width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;background:#3b82f6;border:3px solid #fff;box-shadow:0 0 0 6px rgba(59,130,246,.22)}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:600;background:var(--card);
  border-radius:22px 22px 0 0;box-shadow:0 -8px 26px rgba(90,70,50,.22);
  transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);
  max-height:78%;overflow-y:auto;padding:10px 14px calc(16px + env(safe-area-inset-bottom))}
#sheet.on{transform:translateY(0)}
.grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:2px auto 10px}
.acts{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}
.acts button,.acts a{display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none;
  border:1.5px solid var(--line);background:#fdf9f3;color:var(--ink);border-radius:13px;
  padding:10px 6px;font:inherit;font-weight:700;font-size:13px;cursor:pointer}
.acts .prim{background:var(--sea);border-color:var(--sea);color:#fff}
.near{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.near a{text-decoration:none;background:#f4ede3;color:var(--sub);border-radius:999px;padding:6px 11px;font-size:12px;font-weight:700}
.slist{display:flex;gap:10px;align-items:center;padding:9px 2px;border-bottom:1px dashed var(--line);cursor:pointer}
.slist .nb{flex:none;width:24px;height:24px;font-size:12px}
.hint{background:#fff4dd;color:#8a5f16;border-radius:12px;padding:8px 11px;font-size:12.5px;font-weight:700;margin-top:8px}
.hint.b{background:#e9f4fd;color:#1d5f8a}
.hint.r{background:#fdeae7;color:#a8402f}
.hint.g{background:#e6f5ec;color:#2c7049}
.dist{font-size:12px;font-weight:800;color:#3b82f6}
.kv{display:flex;gap:8px;font-size:12.5px;padding:4px 0;border-bottom:1px dashed var(--line)}
.kv b{flex:none;width:64px;color:var(--sub);font-weight:700}
.kv a{color:var(--sea-d)}
.st{display:inline-block;font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 8px;margin-left:4px}
.st.open{background:#e2f3e9;color:#2f7d52}
.st.soon{background:#fdf0d9;color:#96660f}
.st.after,.st.last{background:#fde8e5;color:#b23f31}
.st.before{background:#eaeef2;color:#5c6b78}

/* SOS */
#sos{position:fixed;left:12px;bottom:calc(12px + var(--navh));z-index:40;width:52px;height:52px;border-radius:50%;
  border:none;background:linear-gradient(150deg,#ff8b7a,#e2685a);color:#fff;font-size:12px;font-weight:800;
  box-shadow:0 6px 16px rgba(226,104,90,.45);cursor:pointer;line-height:1.1}
body.mapmode #sos{bottom:calc(12px + var(--navh))}
#modal{position:fixed;inset:0;z-index:950;background:rgba(60,45,35,.5);display:none;align-items:flex-end;justify-content:center}
#modal.on{display:flex}
#modalin{background:var(--bg);width:100%;max-width:560px;max-height:88%;overflow-y:auto;
  border-radius:22px 22px 0 0;padding:12px 14px calc(20px + env(safe-area-inset-bottom))}
.mclose{float:right;border:none;background:#f2eae0;border-radius:50%;width:32px;height:32px;font-size:16px;cursor:pointer}
.tel{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.tel a{margin-left:auto;background:var(--ok);color:#fff;text-decoration:none;border-radius:999px;padding:6px 14px;font-weight:800;font-size:12.5px}
.big{width:100%;background:#e2685a;color:#fff;border:none;border-radius:16px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;margin:8px 0}
.lightbox{position:fixed;inset:0;z-index:990;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center}
.lightbox.on{display:flex}
.lightbox img{max-width:96%;max-height:88%;border-radius:10px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-top:1.5px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom));display:flex}
nav button{flex:1;border:none;background:none;font:inherit;color:var(--sub);font-size:10.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1}
nav button.on{color:var(--sea-d)}
#toast{position:fixed;left:50%;bottom:calc(20px + var(--navh));z-index:900;background:rgba(70,58,50,.94);color:#fff;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transform:translate(-50%,14px);transition:.25s;max-width:88%;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#offbar{position:fixed;left:0;right:0;top:0;z-index:920;background:#5c6b78;color:#fff;text-align:center;
  font-size:12px;font-weight:800;padding:5px;display:none}
body.offline #offbar{display:block}
footer{text-align:center;color:var(--sub);font-size:11px;padding:22px 0 6px}
</style>
<style id="splash-css">#splash{--heroH:38vh;--runSec:9s;--flip:1}
#splash{position:fixed;inset:0;overflow:hidden;
  background:linear-gradient(180deg,#8fd8ef 0%,#bdeaf6 42%,#e8f7fb 62%,#ffeec9 100%);
  transition:opacity .55s ease,visibility .55s}
#splash.out{opacity:0;visibility:hidden;pointer-events:none}
#splash.checker{background:
  linear-gradient(45deg,#3a3f46 25%,transparent 25%,transparent 75%,#3a3f46 75%),
  linear-gradient(45deg,#3a3f46 25%,transparent 25%,transparent 75%,#3a3f46 75%),#565c66;
  background-size:34px 34px;background-position:0 0,17px 17px}
#splash.checker .sky,#splash.checker .sea,#splash.checker .sand,#splash.checker .shadow,#splash.checker .dusts{opacity:0!important}
#splash .sky{position:absolute;inset:0;transition:opacity .3s}
#splash .sun{position:absolute;top:7%;right:12%;width:78px;height:78px;border-radius:50%;
  background:radial-gradient(circle,#fff6d0 0%,#ffd977 60%,rgba(255,205,90,0) 72%);
  box-shadow:0 0 60px 24px rgba(255,220,140,.5);animation:sunPulse 5s ease-in-out infinite}
@keyframes sunPulse{50%{transform:scale(1.06)}}
#splash .cloud{position:absolute;background:#fff;border-radius:100px;opacity:.85}
#splash .cloud::before,#splash .cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}

function dist(a,b){const R=6371,r=Math.PI/180,dla=(b[0]-a[0])*r,dlo=(b[1]-a[1])*r;
  const h=Math.sin(dla/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dlo/2)**2;

const DBS={};
function idb(){
  if(DBS.p) return DBS.p;
  DBS.p=new Promise((res,rej)=>{
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r=indexedDB.open('enoshima-trip',1);
    r.onupgradeneeded=e=>{const d=e.target.result;
      if(!d.objectStoreNames.contains('tiles')) d.createObjectStore('tiles');
      if(!d.objectStoreNames.contains('photos')) d.createObjectStore('photos');};
    r.onsuccess=e=>res(e.target.result);
    r.onerror=()=>rej(r.error);
  });
  return DBS.p;
}
function idbGet(st,k){return idb().then(d=>new Promise((res,rej)=>{
  const q=d.transaction(st).objectStore(st).get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
function idbPut(st,k,v){return idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction(st,'readwrite');t.objectStore(st).put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbDel(st,k){return idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction(st,'readwrite');t.objectStore(st).delete(k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}
function idbCount(st){return idb().then(d=>new Promise((res,rej)=>{
  const q=d.transaction(st).objectStore(st).count();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}));}
function idbClear(st){return idb().then(d=>new Promise((res,rej)=>{
  const t=d.transaction(st,'readwrite');t.objectStore(st).clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);}));}

const PHURL=new Map();
function shrink(file,max,q){
  return new Promise((res,rej)=>{
    const fr=new FileReader();
    fr.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const s=Math.min(1,max/Math.max(img.width,img.height));
        const c=document.createElement('canvas');
        c.width=Math.max(1,img.width*s|0); c.height=Math.max(1,img.height*s|0);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>b?res(b):rej(new Error('blob')),'image/jpeg',q);
      };
      img.onerror=()=>rej(new Error('img'));
      img.src=fr.result;
    };
    fr.onerror=()=>rej(new Error('read'));
    fr.readAsDataURL(file);
  });
}

function hrsStatus(hrs,at){
  if(!hrs) return null;
  let m=at.getHours()*60+at.getMinutes();
  const o=hm(hrs.o), c=hm(hrs.c), last=hrs.last?hm(hrs.last):c;
  if(c>1440 && m<o) m+=1440;
  if(m<o) return {s:'before',txt:'開店前',t:'開くのは '+hrs.o};
  if(m>=c) return {s:'after',txt:'閉まってる',t:hrs.c+' まで'};
  if(m>=last) return {s:'last',txt:'最終入場すぎ',t:'最終 '+hrs.last};
  const left=Math.min(c,last)-m;
  if(left<=45) return {s:'soon',txt:'あと'+left+'分',t:'まもなく終了'};
  return {s:'open',txt:'営業中',t:'あと'+Math.floor(left/60)+'時間'+(left%60)+'分'};
}

  const now=Date.now(), toLimit=a.limit.getTime()-now, toEvent=a.at.getTime()-now;
  const hot=toLimit<3*36e5;
  const s=spotById(a.id);
  let live='';
  if(me&&s&&s.ll){
    const d=dist(me,s.ll), m=etaMin(d);
    const slack=Math.round(toEvent/6e4)-m;
    live='<div class="mini">🧭 いまの現在地から直線 '+km(d)+'／'+({car:'車',transit:'電車',walk:'徒歩'})[S.moveMode]+'で目安 '+m+'分'
      +'　<b style="color:'+(slack<20?'#c23b57':(slack<60?'#96660f':'#2f7d52'))+'">'
      +(slack>=0?'余裕 '+slack+'分':'すでに '+(-slack)+'分オーバー')+'</b></div>';
  }
  const pct=Math.max(0,Math.min(100,100-(toLimit/(24*36e5))*100));
  return '<div class="alert '+(hot?'hot':'')+'">'
    +'<div class="lb">⏰ 動かせない予定まで逆算</div>'
    +'<div class="bg">'+a.it.icon+' '+esc(a.it.title)+'</div>'
    +'<div class="mini">'+a.d.date.slice(5).replace('-','/')+'（'+a.d.wd+'）'+a.it.time+' 集合／開始　残り <b>'+dur(toEvent)+'</b></div>'
    +'<div class="mini">🚩 <b>'+(a.lead>0?('出発リミット '+a.limit.toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})+'（あと '+dur(toLimit)+'）'):'ここが起点です')+'</b>'
    +(a.it.useHome?'　※家からの所要 '+S.leadHome+'分で計算（じゅんびタブで変更可）':'')+'</div>'
    +live
    +'<div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>'
    +'</div>';
}

   8. 地図（オフラインタイル込み）

const TILES=[
  {id:'osm',  name:'標準（OSM）',        url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',max:19,at:'&copy; OpenStreetMap contributors'},
  {id:'pale', name:'淡色（地理院）',      url:'https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png',max:18,at:'地理院タイル'},
  {id:'photo',name:'航空写真（地理院）',  url:'https://cyberjapandata.gsi.go.jp/xyz/seamlessphoto/{z}/{x}/{y}.jpg',max:18,at:'地理院タイル'}
];
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
let map=null,tileLayer=null,pinLayer=null,lineLayer=null,meMk=null,me=null,pickFor=null,addMode=false;
let OfflineTL=null;

function initMap(){
  if(map) return;
  if(typeof L==='undefined'){
    $('#map').innerHTML='<div style="padding:70px 24px;text-align:center;font-weight:700;color:#8f7f73">'
      +'地図ライブラリを読み込めませんでした。<br>一度オンラインで開くとブラウザにキャッシュされます。</div>';
    return;
  }
  if(!OfflineTL){
    OfflineTL=L.TileLayer.extend({
      createTile:function(coords,done){
        const t=document.createElement('img'); t.alt=''; t.setAttribute('role','presentation');
        const key=this.options.tsid+'/'+coords.z+'/'+coords.x+'/'+coords.y;
        const url=this.getTileUrl(coords);
        t.onload=()=>done(null,t);
        t.onerror=()=>{ if(!t._f){ t._f=1; t.src=BLANK; } done(null,t); };
        idbGet('tiles',key).then(b=>{
          if(b){ const u=URL.createObjectURL(b); t._obj=u; t.src=u; }
          else t.src=url;
        }).catch(()=>{ t.src=url; });
        return t;
      }
    });
  }
  map=L.map('map',{zoomControl:false}).setView([35.52,139.60],9);
  setTile(S.tile);
  L.control.zoom({position:'bottomright'}).addTo(map);
  pinLayer=L.layerGroup().addTo(map);
  lineLayer=L.layerGroup().addTo(map);
  map.on('click',onMapClick);
  drawMap(true);
}
function setTile(i){
  S.tile=((i%TILES.length)+TILES.length)%TILES.length; save();
  if(!map) return;
  if(tileLayer) map.removeLayer(tileLayer);
  const t=TILES[S.tile];
  tileLayer=new OfflineTL(t.url,{maxZoom:t.max,attribution:t.at,tsid:t.id});
  tileLayer.on('tileunload',e=>{ if(e.tile&&e.tile._obj){ URL.revokeObjectURL(e.tile._obj); e.tile._obj=null; } });
  tileLayer.addTo(map);
}
function visible(){
  const all=spots().filter(s=>s.ll);
  if(S.dayFilter==='all') return all;
  if(S.dayFilter==='poi') return all.filter(s=>s.kind!=='plan');
  return all.filter(s=>s.di===+S.dayFilter||s.kind!=='plan');
}
function drawMap(fit){
  if(!map) return;
  const placing=!!(pickFor||addMode);
  pinLayer.clearLayers(); lineLayer.clearLayers();
  const vs=visible();
  if(S.route&&S.dayFilter!=='poi'){
    DAYS.forEach((d,di)=>{
      if(S.dayFilter!=='all'&&+S.dayFilter!==di) return;
      const pts=spots().filter(s=>s.kind==='plan'&&s.di===di&&s.ll).map(s=>s.ll);
      if(pts.length>1) L.polyline(pts,{color:d.color,weight:4,opacity:.55,dashArray:'2 9',lineCap:'round'}).addTo(lineLayer);
    });
  }
  vs.forEach(s=>{
    const done=!!S.done[s.id], sel=S.sel===s.id, small=s.kind!=='plan';
    const np=photosOf(s.id).length;
    const html='<div class="pin '+(small?'small ':'')+(done?'dim ':'')+(sel?'sel':'')+'" style="--c:'+s.color+'">'
      +'<i>'+s.it.icon+'</i>'+(s.kind==='plan'?'<b>'+s.no+'</b>':'')+(np?'<u>📷</u>':'')+'</div>';
    const mk=L.marker(s.ll,{icon:L.divIcon({html,className:'',iconSize:[0,0]}),
      zIndexOffset:sel?1000:(small?-100:0),interactive:!placing});
    mk.addTo(pinLayer);
    if(!placing) mk.on('click',()=>selectSpot(s.id,false));
  });
  if(fit&&vs.length){
    const target=(S.dayFilter==='all')?vs.filter(s=>s.kind==='plan'):vs;
    if(target.length) map.fitBounds(L.latLngBounds(target.map(s=>s.ll)),{padding:[70,70],maxZoom:15});
  }
  renderChips(); mapCount();
}
function setPlacing(mode,id,msg){
  pickFor=mode==='pick'?id:null;

function onMapClick(e){

/* ============================================================
   9. オフライン地図の保存
   ============================================================ */
function deg2tile(lat,lon,z){
  const n=Math.pow(2,z), la=lat*Math.PI/180;
  return [Math.floor((lon+180)/360*n),
          Math.floor((1-Math.log(Math.tan(la)+1/Math.cos(la))/Math.PI)/2*n)];
}
function tileListFor(area,tsid){
  const out=[];
  for(let z=area.z[0];z<=area.z[1];z++){
    const t1=deg2tile(area.b[1][0],area.b[0][1],z);
    const t2=deg2tile(area.b[0][0],area.b[1][1],z);
    for(let x=Math.min(t1[0],t2[0]);x<=Math.max(t1[0],t2[0]);x++)
      for(let y=Math.min(t1[1],t2[1]);y<=Math.max(t1[1],t2[1]);y++)
        out.push({z,x,y,key:tsid+'/'+z+'/'+x+'/'+y});
  }
  return out;
}
let dling=false;
async function downloadArea(areaId){
  if(dling) return toast('いまダウンロード中です');
  const area=DLAREAS.find(a=>a.id===areaId); if(!area) return;
  const ts=TILES[S.tile];
  const list=tileListFor(area,ts.id);
  if(!confirm(area.name+'（'+ts.name+'）を保存します。\nタイル約'+list.length+'枚・目安'+Math.round(list.length*28/1024)+'MB。\n地図サーバーに負荷をかけるので、必要な分だけ1回で済ませてください。よろしい？')) return;
  dling=true;
  const prog=$('#dlprog'); let ok=0,ng=0,i=0;
  const upd=()=>{ if(prog) prog.innerHTML='<div class="bar"><i style="width:'+((ok+ng)/list.length*100).toFixed(1)+'%"></i></div>'
    +'<div class="muted" style="margin-top:4px">'+(ok+ng)+' / '+list.length+' 枚　失敗 '+ng+'</div>'; };
  upd();
  async function worker(){
    while(i<list.length){
      const t=list[i++];
      try{
        const has=await idbGet('tiles',t.key);
        if(has){ ok++; upd(); continue; }
        const url=ts.url.replace('{z}',t.z).replace('{x}',t.x).replace('{y}',t.y);
        const r=await fetch(url,{cache:'force-cache'});
        if(!r.ok) throw new Error('http');
        const b=await r.blob();
        await idbPut('tiles',t.key,b); ok++;
      }catch(e){ ng++; }
      if((ok+ng)%12===0) await new Promise(r=>setTimeout(r,90));
      upd();
    }
  }
  await Promise.all([worker(),worker(),worker(),worker()]);
  dling=false;
  S.cached[areaId+'@'+ts.id]={ts:Date.now(),n:ok,name:area.name+'／'+ts.name};
  save(); render();
  toast('保存できました（'+ok+'枚'+(ng?'／失敗'+ng:'')+'）');
}

/* ============================================================
   11. お金・割り勘・投票
   ============================================================ */
function gasTotal(){
  const g=S.gas;
  return Math.round((+g.km||0)/Math.max(1,+g.kml||1)*(+g.yen||0))+(+g.toll||0)+(+g.park||0);
}
function gasHeads(){
  const n=S.members.length||1;
  if(!S.gas.exempt) return n;
  return Math.max(1,n-S.drivers.filter(d=>S.members.includes(d)).length);
}
function totals(){
  const min=S.costs.reduce((a,c)=>a+(+c.min||0),0), max=S.costs.reduce((a,c)=>a+(+c.max||0),0);
  const n=Math.max(1,S.members.length);
  return {min,max,n,gmin:min*n,gmax:max*n};
}
function settle(){
  const names=S.members.slice(), net={}; names.forEach(n=>net[n]=0);
  S.payments.forEach(p=>{
    if(!names.includes(p.payer)) return;
    const tg=(p.targets&&p.targets.length)?p.targets.filter(n=>names.includes(n)):names;
    if(!tg.length) return;
    net[p.payer]+=+p.amount;
    const sh=(+p.amount)/tg.length; tg.forEach(n=>net[n]-=sh);
  });
  const cred=names.map(n=>({n,v:net[n]})).filter(o=>o.v>1).sort((a,b)=>b.v-a.v);
  const debt=names.map(n=>({n,v:-net[n]})).filter(o=>o.v>1).sort((a,b)=>b.v-a.v);
  const tx=[]; let i=0,j=0;
  while(i<debt.length&&j<cred.length){
    const a=Math.min(debt[i].v,cred[j].v);
    tx.push({from:debt[i].n,to:cred[j].n,amount:Math.round(a)});
    debt[i].v-=a; cred[j].v-=a;
    if(debt[i].v<=1)i++; if(cred[j].v<=1)j++;
  }
  return {net,tx};
}

function todayRally(){
  const t=new Date().toISOString().slice(0,10);
  const p=POIS.find(x=>x.rally===t);
  if(p) return {name:p.name,icon:p.icon,note:p.note,ll:S.coords[p.id]||p.ll};
  const now=Date.now();
  const nx=flat().find(e=>e.at.getTime()>now);
  if(!nx) return null;
  const s=spotById(nx.id);
  return s?{name:s.it.title,icon:s.it.icon,note:s.it.place,ll:s.ll}:null;
}

function render(){

  document.body.classList.toggle('mapmode',S.tab==='map');
  if(S.tab==='map'){
    initMap();
    if(map) setTimeout(()=>map.invalidateSize(),60);
    renderChips(); mapCount();
    $('#btnRoute').classList.toggle('on',S.route);
  }else{
    $('#view').innerHTML=(views[S.tab]||viewPlan)();
    window.scrollTo({top:0});
    hydratePhotos();
  }
  $('#nav').innerHTML=TABS.map(t=>'<button data-act="tab" data-id="'+t.id+'" class="'+(S.tab===t.id?'on':'')+'">'
    +'<i>'+t.icon+'</i>'+t.label+'</button>').join('');
}

document.addEventListener('click',function(e){
  const b=e.target.closest('[data-act]'); if(!b) return;
  const a=b.dataset.act;

  /* ---- ナビ・地図 ---- */
  if(a==='tab'){ S.tab=b.dataset.id; save(); render(); if(S.tab!=='map') closeSheet(); }
  else if(a==='dfil'){ S.dayFilter=b.dataset.id; S.sel=null; save(); closeSheet(); drawMap(true); }
  else if(a==='fly'){ selectSpot(b.dataset.id,false); }
  else if(a==='pick'){ closeSheet(); setPlacing('pick',b.dataset.id,'📌 地図をタップして位置を決めてください'); }
  else if(a==='addmode'){ closeSheet(); setPlacing('add',null,'⭐ 地図をタップして場所を追加'); }
  else if(a==='exdel'){
    S.extras=S.extras.filter(x=>x.id!==b.dataset.id); delete S.coords[b.dataset.id];
    save(); closeSheet(); drawMap(false); toast('削除しました');
  }
  else if(a==='copyll'){ const s=spotById(b.dataset.id); if(s&&s.ll) copy(s.ll[0]+','+s.ll[1]); }
  else if(a==='sharehere'){
    const s=spotById(b.dataset.id); if(!s||!s.ll) return;
    share(s.it.title+'\n'+(s.it.place||'')+'\n'+gPin(s.ll));
  }
  else if(a==='donesheet'){ const id=b.dataset.id; S.done[id]=!S.done[id]; save(); drawMap(false); sheetSpot(id); }
  else if(a==='tomap'){
    S.tab='map'; const id=b.dataset.id; S.dayFilter='all'; save(); render();
    setTimeout(function(){const s=spotById(id); if(s&&s.ll) selectSpot(id,false); else {S.sel=id; sheetSpot(id);}},140);
  }
  else if(a==='daymap'){ S.tab='map'; S.dayFilter=b.dataset.id; S.sel=null; save(); render(); setTimeout(()=>drawMap(true),140); }
  else if(a==='toplan'){ S.tab='plan'; save(); closeSheet(); render(); }

  /* ---- しおり ---- */
  else if(a==='done'){ S.done[b.dataset.id]=!S.done[b.dataset.id]; save(); render(); }
  else if(a==='allreset'){ S.done={}; save(); render(); toast('チェックを戻しました'); }
  else if(a==='copyplan'){ copy(planText()); }
  else if(a==='shareplan'){ share(planText()); }
  else if(a==='wx'){ fetchWx(true); }

  /* ---- 写真 ---- */
  else if(a==='phadd'){ pickPhoto(b.dataset.id); }
  else if(a==='phdel'){
    const id=b.dataset.id, ow=b.dataset.owner;
    if(!confirm('この写真を消します。よろしい？')) return;
    S.photos[ow]=(S.photos[ow]||[]).filter(p=>p.id!==id);
    if(!S.photos[ow].length) delete S.photos[ow];
    idbDel('photos',id).catch(()=>{});
    if(PHURL.has(id)){ URL.revokeObjectURL(PHURL.get(id)); PHURL.delete(id); }
    save();
    if(S.tab==='map'){ drawMap(false); if(S.sel) sheetSpot(S.sel); } else render();
  }
  else if(a==='lb'){
    const u=PHURL.get(b.dataset.id); if(!u) return;
    $('#lbimg').src=u; $('#lb').classList.add('on');
  }
  else if(a==='phclear'){
    if(!confirm('保存した写真を全部消します。よろしい？')) return;
    idbClear('photos').then(function(){
      S.photos={}; PHURL.forEach(u=>URL.revokeObjectURL(u)); PHURL.clear();
      save(); render(); toast('写真を消しました');
    });
  }

  /* ---- メンバー ---- */
  else if(a==='madd'){ S.members.push('メンバー'+(S.members.length+1)); save(); render(); }
  else if(a==='mdel'){
    if(S.members.length>1){
      const g=S.members.pop(); S.drivers=S.drivers.filter(d=>d!==g);
      if(S.meName===g) S.meName=S.members[0];
      save(); render();
    }
  }
  else if(a==='mnew'){
    const v=$('#mnew').value.trim();
    if(!v) return toast('名前を入れてね');
    if(S.members.includes(v)) return toast('もういます');
    S.members.push(v); save(); render();
  }
  else if(a==='mrem'){
    if(S.members.length<=1) return toast('1人は必要です');
    const n=b.dataset.n;
    S.members=S.members.filter(x=>x!==n); S.drivers=S.drivers.filter(x=>x!==n);
    if(S.meName===n) S.meName=S.members[0];
    save(); render();
  }
  else if(a==='drv'){
    const n=b.dataset.n;
    S.drivers=S.drivers.includes(n)?S.drivers.filter(x=>x!==n):S.drivers.concat([n]);
    save(); render();
  }

  /* ---- 費用 ---- */
  else if(a==='cadd'){
    const v=$('#cnew').value.trim(); if(!v) return toast('項目名を入れてね');
    S.costs.push({id:'c'+Date.now(),icon:'✨',label:v,min:0,max:0,note:''}); save(); render();
  }
  else if(a==='cdel'){ S.costs=S.costs.filter(c=>c.id!==b.dataset.id); save(); render(); }
  else if(a==='creset'){ S.costs=COSTS.map(c=>({...c})); S.costVer=COST_VER; save(); render(); toast('初期値に戻しました'); }
  else if(a==='gpush'){
    const per=Math.round(gasTotal()/Math.max(1,gasHeads()));
    const c=S.costs.find(x=>x.id==='car');
    if(c){ c.min=per; c.max=per; c.note='ガソリン計算機から反映（'+gasHeads()+'人割り）'; save(); render(); toast('車の諸経費に反映しました'); }
  }
  else if(a==='gpay'){
    const payer=S.drivers[0]||S.meName;
    const tg=S.gas.exempt?S.members.filter(n=>!S.drivers.includes(n)):[];
    S.payments.push({id:'y'+Date.now(),payer:payer,amount:gasTotal(),label:'ガソリン・高速・駐車場',
      targets:(tg.length&&tg.length!==S.members.length)?tg:[]});
    save(); S.tab='crew'; render(); toast(payer+' の立て替えとして記録しました');
  }
  else if(a==='gexempt'){ S.gas.exempt=b.checked; save(); render(); }

  /* ---- 支払い ---- */
  else if(a==='padd'){
    const amount=+$('#pamount').value; if(!amount) return toast('金額を入れてね');
    const tg=$$('.ptg').filter(x=>x.checked).map(x=>x.value);
    if(!tg.length) return toast('対象を1人以上選んでね');
    S.payments.push({id:'y'+Date.now(),payer:$('#ppayer').value,amount:amount,label:$('#plabel').value.trim(),
      targets:tg.length===S.members.length?[]:tg});
    save(); render(); toast('記録しました');
  }
  else if(a==='pdel'){ S.payments=S.payments.filter(p=>p.id!==b.dataset.id); save(); render(); }
  else if(a==='copysettle'){
    const r=settle();
    copy('🧮 精算\n'+r.tx.map(t=>t.from+' → '+t.to+' に '+yen(t.amount)).join('\n'));
  }

  /* ---- 投票 ---- */
  else if(a==='vote'){
    const pid=b.dataset.id, i=+b.dataset.i;
    S.votes[pid]=S.votes[pid]||{};
    if(S.votes[pid][S.meName]===i) delete S.votes[pid][S.meName];
    else S.votes[pid][S.meName]=i;
    save();
    if(S.tab==='map'&&S.sel) sheetSpot(S.sel); else render();
  }
  else if(a==='votecopy'){
    const mine={};
    POLLS.forEach(function(p){ const v=(S.votes[p.id]||{})[S.meName]; if(v!=null) mine[p.id]=v; });
    if(!Object.keys(mine).length) return toast('まだ回答がありません');
    copy('【えのしま合宿・回答】'+S.meName+'\n'+b64enc({t:'vote',who:S.meName,v:mine}));
  }
  else if(a==='votein'){
    const raw=$('#votein').value.trim();
    const m=raw.match(/[A-Za-z0-9+/=]{16,}/);
    if(!m) return toast('コードが見つかりません');
    try{
      const o=b64dec(m[0]);
      if(o.t!=='vote') throw new Error('bad');
      if(!S.members.includes(o.who)) S.members.push(o.who);
      Object.keys(o.v).forEach(function(pid){ S.votes[pid]=S.votes[pid]||{}; S.votes[pid][o.who]=o.v[pid]; });
      save(); render(); toast(o.who+' さんの回答を取り込みました');
    }catch(err){ toast('読み取れませんでした'); }
  }

  /* ---- リスト ---- */
  else if(a==='li'){ const it=S[b.dataset.key].find(x=>x.id===b.dataset.id); if(it){it.on=!it.on; save(); render();} }
  else if(a==='lidel'){ const k=b.dataset.key; S[k]=S[k].filter(x=>x.id!==b.dataset.id); save(); render(); }
  else if(a==='liadd'){
    const k=b.dataset.key, v=$('#new-'+k).value.trim(); if(!v) return toast('内容を入れてね');
    S[k].push({id:k+Date.now(),text:v,on:false}); save(); render();
  }

  /* ---- オフライン地図 ---- */
  else if(a==='dl'){ downloadArea(b.dataset.id); }
  else if(a==='dlinfo'){
    idbCount('tiles').then(function(n){
      const msg='保存済みタイル '+n+'枚（目安 '+Math.round(n*28/1024)+'MB）';
      if(navigator.storage&&navigator.storage.estimate){
        navigator.storage.estimate().then(function(e){
          alert(msg+'\nこのサイトの使用量 '+Math.round((e.usage||0)/1048576)+'MB / 上限目安 '+Math.round((e.quota||0)/1048576)+'MB');
        });
      } else alert(msg);
    }).catch(()=>toast('取得できませんでした'));
  }
  else if(a==='dlclear'){
    if(!confirm('保存した地図タイルを全部消します。よろしい？')) return;
    idbClear('tiles').then(function(){ S.cached={}; save(); render(); toast('地図キャッシュを消しました'); });
  }

  /* ---- SOS ---- */
  else if(a==='mclose'){ $('#modal').classList.remove('on'); }
  else if(a==='sosloc'){ sosLoc(); }
  else if(a==='sosshare'){ share(decodeURIComponent(b.dataset.t)); }
  else if(a==='soscopy'){ copy(decodeURIComponent(b.dataset.t)); }
  else if(a==='cnadd'){
    const n=$('#cnname').value.trim(), t=$('#cntel').value.trim();
    if(!n||!t) return toast('名前と電話番号を入れてね');
    S.contacts.push({name:n,tel:t}); save(); openSOS(); toast('追加しました');
  }
  else if(a==='cndel'){ S.contacts.splice(+b.dataset.i,1); save(); openSOS(); }
  else if(a==='soshost'){
    S.sos.host=$('#hostn').value.trim(); S.sos.hostTel=$('#hostt').value.trim();
    S.sos.hotel=$('#hoteln').value.trim(); S.sos.hotelTel=$('#hotelt').value.trim();
    save(); openSOS(); toast('保存しました');
  }

  /* ---- データ ---- */
  else if(a==='clearcoords'){
    if(confirm('手で直したピンの位置を全部リセットします。よろしい？')){ S.coords={}; save(); render(); toast('リセットしました'); }
  }
  else if(a==='export'){
    const out=Object.assign({},S); delete out.photos;
    const bl=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
    const u=URL.createObjectURL(bl), el=document.createElement('a');
    el.href=u; el.download='enoshima-trip.json'; el.click();
    setTimeout(()=>URL.revokeObjectURL(u),1500); toast('書き出しました');
  }
  else if(a==='import'){
    try{
      const p=JSON.parse($('#imp').value);
      const keepPhotos=S.photos;
      S=Object.assign(fresh(),p);
      S.photos=Object.assign(keepPhotos,p.photos||{});
      save(); render(); if(map) drawMap(true); toast('読み込みました');
    }catch(err){ toast('JSONが読めませんでした'); }
  }
  else if(a==='reset'){
    if(confirm('保存データを全部消して最初の状態に戻します（写真と地図キャッシュは残ります）。よろしい？')){
      try{ localStorage.removeItem(KEY); OLDKEYS.forEach(k=>localStorage.removeItem(k)); }catch(e){}
      S=fresh(); MIGRATED=''; save(); render(); if(map) drawMap(true); toast('リセットしました');
    }
  }
});

   19. 共有・コピー
   ============================================================ */
function b64enc(o){ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }
function b64dec(s){ return JSON.parse(decodeURIComponent(escape(atob(s)))); }
function copy(text){
  const fb=function(t){
    const ta=document.createElement('textarea');
    ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('コピーしました'); }
    catch(e){ toast('コピーできませんでした'); }
    document.body.removeChild(ta);
  };
  if(navigator.clipboard&&navigator.clipboard.writeText)
    navigator.clipboard.writeText(text).then(()=>toast('コピーしました'),()=>fb(text));
  else fb(text);
}
function share(text){
  if(navigator.share) navigator.share({title:'えのしま合宿 2026',text:text}).catch(()=>{});
  else copy(text);
}
function planText(){
  const t=totals();
  let s='🌊 えのしま合宿 2026/9/19〜21\n';
  DAYS.forEach(function(d,di){
    const w=wxOf(di);
    const c=w?((WMO[w.code]||['',''])[0]+' '+Math.round(w.tmax)+'°/'+Math.round(w.tmin)+'° ☔'+w.pop+'%'):'';
    s+='\n■ '+d.date.slice(5).replace('-','/')+'('+d.wd+') '+d.title+(c?'　'+c:'')+'\n';
    d.items.forEach(function(it,ii){
      const ll=S.coords[itemId(di,ii)]||it.ll;
      s+=it.time+' '+it.title+(it.place?'（'+it.place+'）':'')+(it.hard?' ★時間厳守':'')+(it.tbd?' ※未確認':'')+'\n';
      if(ll) s+='   '+gPin(ll)+'\n';
    });
  });
  s+='\n💰 1人あたり目安：'+yen(t.min)+(t.max!==t.min?'〜'+yen(t.max):'')+'\n';
  S.costs.forEach(c=>s+='  ・'+c.label+' '+yen(c.min)+(c.max!==c.min?'〜'+yen(c.max):'')+'\n');
  const left=S.todos.filter(x=>!x.on);
  if(left.length){ s+='\n📋 やること\n'; left.forEach(x=>s+='  ・'+x.text+(x.due?'（〜'+x.due.slice(5).replace('-','/')+'）':'')+'\n'); }
  return s;
}

function tick(){
  const now=Date.now(), st=new Date(TRIP.start).getTime(), en=new Date(TRIP.end).getTime(), el=$('#count');
  const a=nextAnchor();
  if(now<st){
    const ms=st-now, d=Math.floor(ms/864e5), h=Math.floor(ms/36e5)%24, m=Math.floor(ms/6e4)%60;
    el.textContent=d>0?('⏳ 出発まであと '+d+'日 '+h+'時間'):('⏳ あと '+h+'時間 '+m+'分');
  }else if(now<=en+36e5){
    el.textContent=a?('⏰ '+a.it.title+' まで '+dur(a.at-now)):'🎉 合宿中！たのしんで';
  }else el.textContent='🌇 おつかれさまでした';
  if(S.tab==='map') mapCount();
}

<style id="pro-ui">
/* ---------- 1. デザイントークン ---------- */
:root{
  --sea:#1b8db3; --sea-2:#35b6d8; --sea-d:#0e6a88; --sea-soft:#e9f6fb;
  --sun:#f6893f; --sun-soft:#fff2e6;
  --pink:#f5738d; --pink-soft:#ffe9ee;
  --bg:#faf6f0; --card:#ffffff;
  --ink:#2f2a25; --sub:#7c7168; --line:#ece4d8;
  --hair:rgba(60,45,35,.09);
  --ok:#3f9e73; --warn:#c98a22; --bad:#d55a4c; --poi:#4a95d6;
  --e1:0 1px 2px rgba(60,45,35,.05),0 2px 8px -3px rgba(60,45,35,.10);
  --e2:0 2px 6px rgba(60,45,35,.05),0 14px 28px -14px rgba(60,45,35,.24);
  --e3:0 6px 14px rgba(60,45,35,.07),0 26px 52px -18px rgba(60,45,35,.30);
  --sh:var(--e1);
  --r:20px;
  --navh:calc(68px + env(safe-area-inset-bottom));
}
body{
  background:radial-gradient(1100px 460px at 50% -240px,#d9eff7 0,rgba(217,239,247,0) 68%),var(--bg);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  letter-spacing:.005em;
}
::selection{background:rgba(27,141,179,.18)}
:focus-visible{outline:2px solid var(--sea);outline-offset:2px;border-radius:10px}
.wrap{max-width:580px;padding:0 16px}

/* ---------- 2. ヘッダー ---------- */
header{
  padding:22px 0 30px;border-radius:0 0 30px 30px;
  background:linear-gradient(155deg,#3fb8d8 0%,#1b8db3 48%,#116a8a 100%);
  box-shadow:0 14px 34px -18px rgba(14,80,105,.65);
}
header:after{display:none}
header:before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(560px 200px at 88% -30%,rgba(255,255,255,.30),transparent 70%),
             radial-gradient(420px 220px at -10% 120%,rgba(0,0,0,.14),transparent 70%);
}
h1{font-size:25px;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(6,58,78,.28)}
header .sub{font-size:12px;letter-spacing:.05em;opacity:.86;margin-top:4px}
.count{
  margin-top:14px;padding:8px 15px;font-size:13.5px;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.34);
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  box-shadow:0 6px 16px -8px rgba(0,0,0,.35);
}

/* ---------- 3. カード・見出し ---------- */
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--e1);padding:16px;margin:14px 0;
}
.sect{
  display:flex;align-items:center;gap:8px;
  margin:20px 0 10px;font-size:14.5px;letter-spacing:.01em;
}
.sect:before{
  content:"";flex:none;width:4px;height:17px;border-radius:3px;
  background:linear-gradient(180deg,var(--sea-2),var(--sea));
}
.muted{font-size:12px;line-height:1.65}
footer{opacity:.75;padding:26px 0 10px}

/* ---------- 4. ボタン・入力 ---------- */
.btn{
  padding:10px 17px;font-size:13.5px;border-radius:999px;
  background:linear-gradient(180deg,var(--sea-2),var(--sea));
  box-shadow:0 8px 16px -10px rgba(14,106,136,.95);
  transition:transform .12s cubic-bezier(.2,.8,.3,1),box-shadow .2s,filter .2s;
}
.btn:hover{filter:brightness(1.04)}
.btn:active{transform:translateY(1px) scale(.985);box-shadow:0 3px 8px -6px rgba(14,106,136,.9)}
.btn.g{background:#f4ede3;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.o{background:linear-gradient(180deg,#ffab6d,var(--sun));box-shadow:0 8px 16px -10px rgba(214,110,40,.9)}
.btn.r{background:linear-gradient(180deg,#e5776a,var(--bad))}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.w{border-radius:16px;padding:13px}
input,select,textarea{
  background:#fff;border:1.5px solid var(--line);border-radius:13px;padding:10px 12px;
  transition:border-color .15s,box-shadow .15s;
}
input:focus,select:focus,textarea:focus{
  outline:none;border-color:#9ad6e9;box-shadow:0 0 0 4px rgba(27,141,179,.13);
}
.x{border-radius:50%;transition:background .15s,color .15s}
.x:hover{background:#f6efe6;color:var(--bad)}
.stepper button{border:1px solid var(--line);background:#fff;box-shadow:var(--e1)}
.who label{transition:.15s}
.tag{font-size:10px;letter-spacing:.03em;padding:3px 9px}

/* ---------- 5. タイムライン ---------- */
.dayhead{margin:26px 0 10px}
.dayno{width:46px;height:46px;border-radius:16px;box-shadow:var(--e2)}
.daytitle{font-size:17px;letter-spacing:-.01em}
.tl{padding-left:24px}
.tl:before{left:7px;width:2px;background:linear-gradient(180deg,var(--line),rgba(236,228,216,.2))}
.ev:before{left:-21px;top:19px;width:10px;height:10px;border-width:3px;transition:.2s}
.ev.cur:before{box-shadow:0 0 0 6px rgba(245,115,141,.16)}
.evbox{
  border:1px solid var(--line);border-radius:18px;padding:13px 14px;
  box-shadow:var(--e1);transition:box-shadow .2s,transform .2s,border-color .2s;
}
.evbox:hover{box-shadow:var(--e2)}
.ev.hard .evbox{border:1px solid #ffd0da;background:linear-gradient(180deg,#fffafb,#fff)}
.ev.cur .evbox{border-color:#ffc4d1;box-shadow:0 0 0 3px rgba(245,115,141,.10),var(--e2)}
.ev.done .evbox{opacity:1;background:#fbf9f6;border-style:dashed;box-shadow:none}
.ev.done .ttl{color:var(--sub);text-decoration:line-through;text-decoration-color:rgba(0,0,0,.2)}
.chk{border-radius:9px;transition:.18s}
.chk:hover{border-color:#c9dfe6;background:#f7fcfd}
.ttl{font-size:15.5px;letter-spacing:-.005em}
.note{border-radius:12px;padding:8px 10px;line-height:1.6;border:1px solid rgba(0,0,0,.03)}
.info{font-size:11.5px}
.pinbtn{padding:5px 12px;transition:.15s}
.pinbtn:hover{filter:brightness(.97)}
.hint{border-radius:14px;padding:10px 12px;line-height:1.65;border-left:3px solid currentColor}
.nb{width:18px;height:18px;font-size:10.5px}

/* ---------- 6. 逆算アラート・天気 ---------- */
.alert{
  border-radius:var(--r);padding:16px;border:1px solid #ffd7de;
  background:linear-gradient(150deg,#fff4f6,#fff);box-shadow:var(--e2);
}
.alert.hot{border-color:#ffb9c6;background:linear-gradient(150deg,#ffe6ea,#fff8f9)}
.alert .lb{letter-spacing:.08em;font-size:11px;text-transform:uppercase}
.alert .bg{font-size:21px;letter-spacing:-.01em;margin-top:2px}
.bar{height:7px;border-radius:99px;background:#f2e7d8;box-shadow:inset 0 1px 2px rgba(0,0,0,.05)}
.bar i{transition:width .6s cubic-bezier(.2,.8,.3,1)}
.wxd{
  border-radius:16px;border:1px solid var(--line);
  background:linear-gradient(180deg,#fbfeff,#f6fbfd);box-shadow:var(--e1);padding:11px 9px;
}
.wxd .ic{font-size:28px;margin:2px 0}
.total{
  border-radius:var(--r);padding:20px;
  background:linear-gradient(150deg,#ffdfb4,#ffb877 70%,#ffa863);
  box-shadow:0 14px 30px -16px rgba(200,120,40,.7);
}
.total b{font-size:32px;letter-spacing:-.02em;margin:4px 0}

/* ---------- 7. リスト・表・投票 ---------- */
table td,table th{padding:9px 4px}

<script>
(function(){
  var GAME='https://iwamotoco-source.github.io/sontyo/';

  /* 地図の丸ボタン5個を1つのドックにまとめる（イベントはそのまま） */
  (function(){
    var wrap=document.getElementById('mapwrap');
    if(!wrap||document.getElementById('mdock'))return;
    var d=document.createElement('div'); d.id='mdock';
    ['btnLoc','btnTile','btnRoute','btnList','btnCam'].forEach(function(id){
      var b=document.getElementById(id); if(b) d.appendChild(b);
    });
    wrap.appendChild(d);
  })();

  /* ヘッダーにミニゲームのピル */
  (function(){
    var hd=document.querySelector('header .wrap');
    if(!hd||document.getElementById('gamepill'))return;
    var a=document.createElement('a');
    a.id='gamepill'; a.className='count gamepill';
    a.href=GAME; a.target='_blank'; a.rel='noopener';
    a.textContent='🎮 ミニゲーム';
    hd.appendChild(a);
  })();

  /* しおり／その他タブの末尾にミニゲームカード */
  function gameCard(){
    return '<a class="gamecard" href="'+GAME+'" target="_blank" rel="noopener">'
      +'<span class="gc-ic">🎮</span>'
      +'<span class="gc-tx"><b>おまけ：ミニゲーム</b>'
      +'<i>移動中のヒマつぶしに。別タブで開きます</i></span>'
      +'<span class="gc-go">▶</span></a>';
  }
  function inject(){
    var v=document.getElementById('view');
    if(!v||v.querySelector('.gamecard'))return;
    if(S.tab==='plan'||S.tab==='more') v.insertAdjacentHTML('beforeend',gameCard());
  }
  var _render=window.render;
  window.render=function(){ _render.apply(this,arguments); try{inject();}catch(e){} };
  render();
})();
</script>
